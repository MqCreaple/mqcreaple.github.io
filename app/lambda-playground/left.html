<div class="card article">
  <h1>Lambda Calculus Playground</h1>
  <p>For more information, see <a href="/zh/posts/2022-08-27/lambda/">this article</a>.</p>
  <h2>Demonstrations:</h2>
  <p class="lambda-r">[ [ "λx", "λy", [ "+", "x", "y" ] ], "2", "3" ]</p>
  <p class="lambda-r">[ "OR", [ "AND", "T", "F" ], ["T"] ]</p>
  <p class="lambda-r" data-repl-table='{"Id": [ "λx", "x" ]}'>[ "λf", "λx", [ "ID", [ "f", "x" ] ] ]</p>
  <h2>Playground:</h2>
  <textarea elastic id="custom" placeholder="type a JSON expression resembling lambda terms.">[ [ "λx", "λy", [ "+", "x", "y" ] ], "2", "3" ]</textarea>
  <p id="target"></p>
</div>
<script>
  autoRender();
  document.addEventListener("DOMContentLoaded", () => {
    var custom = document.getElementById("custom");
    var target = document.getElementById("target");
    custom.addEventListener("input", (event) => {
      try {
        target.style.color = "#000000";
        let content = JSON.parse(custom.value);
        lambdaExpr(content, "lcustom", document.getElementById("target"));
      } catch (e) {
        target.style.color = "red";
        target.innerHTML = e.message;
      }
    });
  });
</script>
