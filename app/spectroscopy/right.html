<div class="card">
  <h2>Game Settings</h2>

  <div class="form-group">
    <label for="carbon-min">Carbon Min</label>
    <input type="range" id="carbon-min" min="0" max="20" value="2" step="1">
    <span class="range-value" id="carbon-min-value">2</span>
  </div>

  <div class="form-group">
    <label for="carbon-max">Carbon Max</label>
    <input type="range" id="carbon-max" min="0" max="20" value="8" step="1">
    <span class="range-value" id="carbon-max-value">8</span>
  </div>

  <div class="form-group">
    <label for="hydrogen-min">Hydrogen Min</label>
    <input type="range" id="hydrogen-min" min="0" max="30" value="2" step="1">
    <span class="range-value" id="hydrogen-min-value">2</span>
  </div>

  <div class="form-group">
    <label for="hydrogen-max">Hydrogen Max</label>
    <input type="range" id="hydrogen-max" min="0" max="30" value="18" step="1">
    <span class="range-value" id="hydrogen-max-value">18</span>
  </div>

  <div class="form-group">
    <label for="num-structures">Number of Structures</label>
    <input type="range" id="num-structures" min="2" max="8" value="4" step="1">
    <span class="range-value" id="num-structures-value">4</span>
  </div>

  <button id="start-game-btn" class="primary-btn">New Game</button>
</div>

<div class="card" id="controls-card">
  <h2>Game Controls</h2>
  <p><button id="check-btn" class="primary-btn" disabled>Check</button></p>
  <p><button id="check-all-btn" class="secondary-btn">Check All Matches</button></p>
  <p><button id="pairing-new-btn" class="secondary-btn">New Game</button></p>
</div>

<div class="card" id="available-structures-card">
  <h2>Available Data</h2>
  <div id="available-structures-info">
    <p>Load data to see available formulas.</p>
  </div>
</div>
