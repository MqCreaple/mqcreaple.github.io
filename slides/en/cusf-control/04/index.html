## Recall: State Space Dynamics

$$ \ddot{\theta} = -\frac{g}{l}\sin\theta $$

![Pendulum phase portrait](../03/pendulum-linearisation.svg)

--

## Recall: Control Theory

$$ \ddot{\theta} = -\frac{g}{l}\sin\theta + \frac{\tau_\text{ext}}{ml^2} $$

![Control model](../01/control-model.svg) <!-- .element: width="100%" -->

Our goal is to design a controller $\mathbf{u} = K(\theta, \theta_d)$ such that the system together with the controller exhibits the desired behaviour.

        <script type="text/template">
## Proportional Controller

Subtract the observed value $y$ from the desired observation $y_d$ (which obtains the **error** $e = y_d - y$), multiply by a constant $k_p$, and use that as the control input $u$.

$$ u = k_p (y_d - y) = k_p e $$

Can be thought of as adding a "restoring force" to the system that pulls it toward the desired state.

In the pendulum example, observed value $y$ is the angle $\theta$, and the control input is the torque $\tau_\text{ext}$.
        </script>

        <script type="text/template">
## Proportional-Derivative Controller

Adding a term proportional to the derivative of error to the proportional controller -- **PD controller**:

$$ u = k_p e + k_d \frac{\mathrm{d}e}{\mathrm{d}t} $$

The derivative term adds "damping" to the system, pulling the system toward the equilibrium, reducing overshooting.

Steady-state error might still remain.
        </script>
    </section>

        <script type="text/template">
## PID Controller

Adding an integral term on top of the PD controller gives the **PID (Proportional-Integral-Derivative) controller**:

$$ u(t) = k_p e(t) + k_d \frac{\mathrm{d}e(t)}{\mathrm{d}t} + k_i \int_0^t e(\tau)\mathrm{d}\tau $$

The integral term uses the accumulated steady-state error to correct the offset.

After adding the integral term, the system is no longer static -- past trajectory affects the integral value, which changes $u$.
        </script>
    </section>

<section data-markdown data-separator="^\n---\n" data-separator-vertical="^\n--\n">
    <script type="text/template">
## Realistic Controllers

In reality, the output of the controller is limited by the physical hardware carrying out the control (e.g. motors, actuators, ...). The output value is saturated:

$$ u = \text{clamp}_{[-u_m, u_m]} \left( k_p e + k_d \dot{e} + k_i \int_0^t e \mathrm{d}\tau \right) $$

Other factors also affect the control signal applied to system:

- Signal transport delay
- Actuator dynamics: actuator delay, hysteresis, ...
- Quantisation in digital signals
- Noise and disturbances

Takeaway point: theoretical model and physical implementation can differ. These factors need to be considered in controller designing.
    </script>
</section>

<script type="module">
	import { createPendulum } from '../01/pendulum.js';
	import { createPendulumStateSpace } from '../02/pendulum-state-space.js';
	import { createAngleController } from './angle-controller.js';

	const demoDefinitions = [
		{ prefix: 'p-control', gains: ['kp'] },
		{ prefix: 'pd-control', gains: ['kp', 'kd'] },
		{ prefix: 'pid-control', gains: ['kp', 'ki', 'kd'], showIntegral: true },
	];
	const demos = demoDefinitions.map(({ prefix, gains, showIntegral }) => {
		const element = suffix => document.getElementById(`${prefix}-${suffix}`);
		const targetInput = element('target');
		const targetOutput = element('target-value');
		const gainInputs = Object.fromEntries(
			gains.map(gain => [gain, element(gain)]),
		);
		const controller = createAngleController({
			target: Number(targetInput.value) * Math.PI / 180,
			...Object.fromEntries(
				Object.entries(gainInputs).map(([gain, input]) => [
					gain,
					Number(input.value),
				]),
			),
		});
		const pendulum = createPendulum(element('simulation'), {
			angle: Math.PI / 4,
			velocity: 0,
			control: controller.control,
		});
		const stateSpaceCanvas = element('state-space');
		const stateSpace = createPendulumStateSpace(stateSpaceCanvas, {
			getState: pendulum.getState,
			getTarget: controller.getTarget,
			getIntegral: showIntegral ? controller.getIntegral : undefined,
			derivative: controller.derivative,
			velocityRange: 12,
		});

		targetInput.addEventListener('input', () => {
			const degrees = Number(targetInput.value);
			controller.setTarget(degrees * Math.PI / 180);
			targetOutput.value = `${degrees}\u00b0`;
			stateSpace.redraw();
		});

		Object.entries(gainInputs).forEach(([gain, input]) => {
			const output = element(`${gain}-value`);
			input.addEventListener('input', () => {
				const value = Number(input.value);
				controller.setGains({ [gain]: value });
				output.value = `${value}`;
				stateSpace.redraw();
			});
		});

		return { pendulum, stateSpace, stateSpaceCanvas };
	});

	const syncRunning = () => {
		demos.forEach(({ pendulum, stateSpace, stateSpaceCanvas }) => {
			const active = stateSpaceCanvas.closest('section')
				.hasAttribute('data-slide-active');
			pendulum.setRunning(active);
			stateSpace.setRunning(active);
		});
	};
	document.addEventListener('slideshowchange', syncRunning);
	syncRunning();
</script>
